<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="droneGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#062e28" />
      <stop offset="100%" stop-color="#021c17" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="32" y1="22" x2="32" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Modern App Icon Tile -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Propeller Blur Circles (4 Rotors) -->
  <circle cx="16" cy="16" r="9" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <ellipse cx="16" cy="16" rx="8" ry="2.2" fill="#34d399" transform="rotate(-30 16 16)" fill-opacity="0.9"/>
  <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>

  <circle cx="48" cy="16" r="9" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <ellipse cx="48" cy="16" rx="8" ry="2.2" fill="#34d399" transform="rotate(30 48 16)" fill-opacity="0.9"/>
  <circle cx="48" cy="16" r="2.2" fill="#ffffff"/>

  <circle cx="16" cy="48" r="9" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <ellipse cx="16" cy="48" rx="8" ry="2.2" fill="#34d399" transform="rotate(30 16 48)" fill-opacity="0.9"/>
  <circle cx="16" cy="48" r="2.2" fill="#ffffff"/>

  <circle cx="48" cy="48" r="9" stroke="#34d399" stroke-width="1.6" stroke-opacity="0.35" stroke-dasharray="3 2"/>
  <ellipse cx="48" cy="48" rx="8" ry="2.2" fill="#34d399" transform="rotate(-30 48 48)" fill-opacity="0.9"/>
  <circle cx="48" cy="48" r="2.2" fill="#ffffff"/>

  <!-- Drone Chassis Arms -->
  <line x1="19" y1="19" x2="27" y2="27" stroke="url(#droneGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="19" x2="37" y2="27" stroke="url(#droneGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="19" y1="45" x2="27" y2="37" stroke="url(#droneGrad)" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="45" x2="37" y2="37" stroke="url(#droneGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Central Fuselage / Cockpit -->
  <path d="M32 23 L39 27.5 L39 36.5 L32 41 L25 36.5 L25 27.5 Z" fill="url(#glowGrad)" stroke="#6ee7b7" stroke-width="1.5"/>

  <!-- Agricultural Leaf / Core Symbol -->
  <path d="M32 27 C35 29 36 33 32 37 C28 33 29 29 32 27 Z" fill="#ffffff"/>
  <circle cx="32" cy="32" r="1.5" fill="#047857"/>

  <!-- Spray Droplets -->
  <circle cx="28" cy="45" r="1.2" fill="#6ee7b7" fill-opacity="0.8"/>
  <circle cx="32" cy="47" r="1.5" fill="#a7f3d0"/>
  <circle cx="36" cy="45" r="1.2" fill="#6ee7b7" fill-opacity="0.8"/>
</svg>